<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">{{ app_name }}</div>
    <div class="brand-sub">Marches publics du Maroc</div>
    <nav class="nav">
      <a href="/" class="{{ 'active' if request.url.path == '/' }}">Tableau de bord</a>
      <a href="/recherche" class="{{ 'active' if request.url.path == '/recherche' }}">Recherche</a>
      <div class="nav-group">Veille</div>
      <a href="/avis" class="{{ 'active' if request.url.path == '/avis' }}">Appels d'offres</a>
      <a href="/veille" class="{{ 'active' if request.url.path == '/veille' }}">Profils &amp; canaux</a>
      <div class="nav-group">Historique</div>
      <a href="/attributions" class="{{ 'active' if request.url.path == '/attributions' }}">Attributions</a>
      <a href="/attributaires" class="{{ 'active' if request.url.path.startswith('/attributaires') }}">Attributaires</a>
      <a href="/acheteurs" class="{{ 'active' if request.url.path == '/acheteurs' }}">Acheteurs</a>
      <div class="nav-group">Donnees</div>
      <a href="/exports" class="{{ 'active' if request.url.path == '/exports' }}">Exports</a>
      <a href="/docs">API</a>
    </nav>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
